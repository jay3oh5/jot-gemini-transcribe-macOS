name: Build macOS App

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Universal macOS App (Intel + Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Universal Jot.app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Jot.xcodeproj \
            -scheme Jot \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            2>&1 | tee xcodebuild.log

      - name: Verify Architectures and Package
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path "*/Build/Products/Debug/Jot.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -f "$APP_PATH/Contents/MacOS/Jot" ]; then
            echo "Jot.app executable not found at: $APP_PATH"
            find ~/Library/Developer/Xcode/DerivedData -name "Jot.app" -type d
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "Verifying binary architectures:"
          file "$APP_PATH/Contents/MacOS/Jot"
          mkdir -p build/dist
          cd "$(dirname "$APP_PATH")"
          zip -r -y "$GITHUB_WORKSPACE/build/dist/Jot-Universal.zip" Jot.app

      - name: Upload Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jot-Universal-Debug
          path: build/dist/Jot-Universal.zip

      - name: Extract Release Notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 -c "
          import re, sys
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          pattern = rf'## \[{re.escape(\"$VERSION\")}\][^\n]*\n(.*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          if match:
              with open('RELEASE_NOTES.md', 'w') as out:
                  out.write(match.group(1).strip() + '\n')
          else:
              with open('RELEASE_NOTES.md', 'w') as out:
                  out.write(content)
          "

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/Jot-Universal.zip
          body_path: RELEASE_NOTES.md
          generate_release_notes: false

      - name: Upload Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
