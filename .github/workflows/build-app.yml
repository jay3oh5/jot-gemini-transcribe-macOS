name: Build macOS App

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build & Package App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Jot.app
        run: |
          xcodebuild build \
            -project Jot.xcodeproj \
            -scheme Jot \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            2>&1 | tee xcodebuild.log

      - name: Package App into ZIP
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Jot.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Jot.app not found in DerivedData"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/dist
          cd "$(dirname "$APP_PATH")"
          zip -r -y "$GITHUB_WORKSPACE/build/dist/Jot-macOS.zip" Jot.app

      - name: Upload Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jot-macOS-Debug
          path: build/dist/Jot-macOS.zip

      - name: Upload Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
