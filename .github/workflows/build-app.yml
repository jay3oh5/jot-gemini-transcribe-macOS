name: Build macOS App

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build Universal macOS App (Intel + Apple Silicon)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Universal Jot.app
        run: |
          xcodebuild build \
            -project Jot.xcodeproj \
            -scheme Jot \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            ARCHS="x86_64 arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM= \
            2>&1 | tee xcodebuild.log

      - name: Verify Architectures and Package
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "Jot.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Jot.app not found in DerivedData"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          echo "Verifying binary architectures:"
          file "$APP_PATH/Contents/MacOS/Jot"
          mkdir -p build/dist
          cd "$(dirname "$APP_PATH")"
          zip -r -y "$GITHUB_WORKSPACE/build/dist/Jot-Universal.zip" Jot.app

      - name: Upload Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jot-Universal-Debug
          path: build/dist/Jot-Universal.zip

      - name: Upload Build Log on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
