name: Build macOS App

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build & Package App
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Jot.app
        run: |
          set -o pipefail
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.bareRepository GIT_CONFIG_VALUE_0=all \
          xcodebuild build \
            -project Jot.xcodeproj \
            -scheme Jot \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData 2>&1 | tee xcodebuild.log || {
              echo "### Build Failed" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              tail -n 80 xcodebuild.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: Package App into ZIP
        run: |
          cd build/DerivedData/Build/Products/Debug
          zip -r -y Jot-macOS.zip Jot.app

      - name: Upload Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jot-macOS-Debug
          path: build/DerivedData/Build/Products/Debug/Jot-macOS.zip
